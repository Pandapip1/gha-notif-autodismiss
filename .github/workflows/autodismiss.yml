name: Dismiss Specific PR Notifications

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  autodismiss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install @octokit/rest @octokit/graphql @octokit/plugin-throttling

      - name: Dismiss automated EIP and ERC updates
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TARGET_OWNER: "3webs-org"
          TARGET_REPO: "eip-info-website"
          PR_AUTHOR: "submodule-update[bot]"
          TITLE_REGEX: "^Automated submodule update"
        run: node dismiss_automated_prs.js

      - name: Dismiss canceled NUR updates
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TARGET_OWNER: "nix-community"
          TARGET_REPO: "NUR"
        run: node dismiss_canceled_actions.js
